<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TYWS Hub Browser Pro</title>
  <script defer src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-panel: #1e293b;
      --bg-key: #334155;
      --bg-key-active: #3b82f6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --green: #10b981;
      --danger: #ef4444;
      --cast-controls-safe-area-height: 100vh !important;
    }

    /* Chặn triệt để lớp phủ <touch-controls> của Google Cast SDK */
    touch-controls,
    cast-media-player {
      display: none !important;
      pointer-events: none !important;
      visibility: hidden !important;
      width: 0 !important;
      height: 0 !important;
      z-index: -9999 !important;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden !important;
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: Arial, Helvetica, sans-serif;
    }

    #app-shell {
      position: relative;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      pointer-events: auto;
    }

    /* THANH ĐIỀU HƯỚNG CỐ ĐỊNH TRÊN CÙNG */
    #top-bar {
      height: 50px;
      background: var(--bg-panel);
      border-bottom: 1px solid #334155;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
      flex-shrink: 0;
      z-index: 100002;
    }

    .nav-btn {
      height: 38px;
      min-width: 42px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid #475569;
      background: #0f172a;
      color: var(--text-main);
      font-size: 14px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
    }

    .nav-btn:active {
      background: var(--bg-key-active);
    }

    .nav-btn.active-mode {
      border-color: var(--green);
      color: #6ee7b7;
    }

    #omnibox {
      flex: 1;
      height: 38px;
      background: #090d16;
      border: 1.5px solid #475569;
      border-radius: 8px;
      padding: 0 12px;
      color: var(--text-main);
      font-size: 15px;
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      cursor: pointer;
    }

    #omnibox.focused {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.25);
    }

    /* VÙNG NỘI DUNG CHÍNH */
    #viewport-area {
      flex: 1;
      position: relative;
      width: 100%;
      overflow: hidden;
      background: #111827;
    }

    /* TRANG BẮT ĐẦU (HOME SCREEN) */
    #home-view {
      position: absolute;
      inset: 0;
      padding: 18px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: radial-gradient(circle at top right, #1e293b, #0f172a 70%);
    }

    .hero-box {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hero-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .hero-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
      margin: 0;
    }

    .status-badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    #home-search-trigger {
      height: 48px;
      border-radius: 10px;
      background: #090d16;
      border: 2px solid #475569;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 16px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .bookmarks-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .bm-card {
      height: 54px;
      border-radius: 10px;
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--text-main);
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }

    .bm-card:active {
      background: var(--bg-key-active);
      transform: scale(0.98);
    }

    /* KHUNG DUYỆT WEB (IFRAME) */
    #web-view {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      background: #ffffff;
    }

    #browser-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #ffffff;
    }

    #loading-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #38bdf8);
      background-size: 200% 100%;
      animation: loadingAnim 1.2s infinite linear;
      display: none;
      z-index: 10;
    }

    @keyframes loadingAnim {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* BÀN PHÍM ẢO NỔI ĐA NĂNG (HIỆN TRÊN MỌI WEBSITE) */
    #virtual-keyboard {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.97);
      border-top: 2px solid var(--accent);
      padding: 6px 8px 8px;
      display: none;
      flex-direction: column;
      gap: 5px;
      z-index: 100005;
      box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.6);
    }

    #virtual-keyboard.visible {
      display: flex;
    }

    #kb-preview-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 36px;
    }

    #kb-target-label {
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      background: #1e293b;
      color: var(--accent);
      white-space: nowrap;
      border: 1px solid #334155;
    }

    #kb-buffer-display {
      flex: 1;
      height: 34px;
      background: #090d16;
      border: 1px solid var(--accent);
      border-radius: 6px;
      padding: 0 10px;
      color: #ffffff;
      font-size: 16px;
      display: flex;
      align-items: center;
      overflow-x: auto;
      white-space: nowrap;
    }

    #kb-cursor {
      display: inline-block;
      width: 2px;
      height: 18px;
      background: var(--accent);
      margin-left: 2px;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    .kb-row {
      display: flex;
      gap: 5px;
      width: 100%;
    }

    .kb-key {
      flex: 1;
      height: 36px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: var(--bg-key);
      color: #ffffff;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .kb-key:active {
      background: var(--bg-key-active);
    }

    .kb-key.wide-2 { flex: 1.8; }
    .kb-key.wide-3 { flex: 3.5; }
    .kb-key.action-go {
      background: var(--green);
      border-color: #059669;
      color: #052e16;
      font-weight: 700;
    }
    .kb-key.action-toggle-on {
      background: #0284c7;
      border-color: var(--accent);
    }
    .kb-key.action-danger {
      background: #7f1d1d;
      border-color: var(--danger);
    }
  </style>
</head>
<body>
  <!-- Thẻ video ẩn giữ tương thích với Cast Receiver SDK -->
  <video id="cast-media" hidden playsinline muted aria-hidden="true"></video>

  <div id="app-shell">
    <!-- THANH ĐIỀU HƯỚNG CỐ ĐỊNH -->
    <header id="top-bar">
      <button class="nav-btn" id="btn-home" title="Về trang bắt đầu">🏠 Home</button>
      <button class="nav-btn" id="btn-back" title="Quay lại">◀</button>

      <div id="omnibox">Chạm để nhập từ khóa hoặc địa chỉ web...</div>

      <button class="nav-btn active-mode" id="btn-proxy-mode" title="Bật/Tắt chế độ tiêm bàn phím vào mọi web">🛡️ Proxy: BẬT</button>
      <button class="nav-btn" id="btn-toggle-kb" title="Hiện/Ẩn bàn phím">⌨️ Phím</button>

    <!-- KHU VỰC HIỂN THỊ -->

      <!-- MÀN HÌNH BẮT ĐẦU -->

          <button class="bm-card" data-url="https://vi.m.wikipedia.org">📖 Wikipedia</button>
          <button class="bm-card" data-url="https://vnexpress.net">📰 VnExpress</button>
          <button class="bm-card" data-url="https://dantri.com.vn">📰 Dân Trí</button>
          <button class="bm-card" data-url="https://tuoitre.vn">📰 Tuổi Trẻ</button>
          <button class="bm-card" data-url="https://tinhte.vn">📱 Tinh Tế</button>
          <button class="bm-card" data-url="https://cafef.vn">📈 CafeF</button>

    <!-- BÀN PHÍM ẢO NỔI (DÙNG CHUNG CHO THANH ĐỊA CHỈ & Ô NHẬP TRÊN MỌI WEBSITE) -->
    <section id="virtual-keyboard">

        <button class="nav-btn" id="kb-btn-close" style="background:#334155;">✖ Ẩn</button>

      <!-- Hàng QWERTY 1 -->
      <div class="kb-row">

    </section>

  <script>
    (function () {
      "use strict";

      // =========================================================================
      // 1. KHỞI TẠO GOOGLE CAST SDK & CHỐNG VĂNG APP (STANDALONE KEEP-ALIVE)
      // =========================================================================
      function purgeTouchControls() {
        document.querySelectorAll("touch-controls").forEach((el) => el.remove());
      }
      purgeTouchControls();
      const observer = new MutationObserver(purgeTouchControls);
      observer.observe(document.documentElement, { childList: true, subtree: true });

      window.addEventListener("load", () => {
        if (window.cast && cast.framework) {
          try {
            const context = cast.framework.CastReceiverContext.getInstance();
            const options = new cast.framework.CastReceiverOptions();
            options.disableIdleTimeout = true;
            options.touchScreenOptimizedApp = true;
            options.maxInactivity = 86400; // 24 giờ
            if (cast.framework.ui && cast.framework.ui.UiConfig) {
              options.uiConfig = new cast.framework.ui.UiConfig();
              options.uiConfig.touchScreenOptimizedApp = true;
            }
            context.start(options);
            document.getElementById("cast-status").textContent = "Cast Sẵn sàng • Chạy Độc Lập";
          } catch (err) {
            console.warn("Cast init warning:", err);
          }
        }
      });

      // Giữ kết nối âm thanh câm (Silent Audio Oscillator) để Nest Hub không bao giờ ngủ
      let keepAliveStarted = false;
      function startAudioKeepAlive() {
        if (keepAliveStarted) return;
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          const ctx = new AudioCtx();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          gain.gain.value = 0.00001;
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          keepAliveStarted = true;
        } catch (e) {}
      }

      // =========================================================================
      // 2. BỘ GÕ TIẾNG VIỆT TELEX TÍCH HỢP
      // =========================================================================
      const VOWEL_TABLE = {
        a: ["a", "à", "á", "ả", "ã", "ạ"],
        ă: ["ă", "ằ", "ắ", "ẳ", "ẵ", "ặ"],
        â: ["â", "ầ", "ấ", "ẩ", "ẫ", "ậ"],
        e: ["e", "è", "é", "ẻ", "ẽ", "ẹ"],
        ê: ["ê", "ề", "ế", "ể", "ễ", "ệ"],
        i: ["i", "ì", "í", "ỉ", "ĩ", "ị"],
        o: ["o", "ò", "ó", "ỏ", "õ", "ọ"],
        ô: ["ô", "ồ", "ố", "ổ", "ỗ", "ộ"],
        ơ: ["ơ", "ờ", "ớ", "ở", "ỡ", "ợ"],
        u: ["u", "ù", "ú", "ủ", "ũ", "ụ"],
        ư: ["ư", "ừ", "ứ", "ử", "ữ", "ự"],
        y: ["y", "ỳ", "ý", "ỷ", "ỹ", "ỵ"]
      };

      const TONE_MAP = { z: 0, f: 1, s: 2, r: 3, x: 4, j: 5 };
      const CHAR_TO_BASE = {};
      Object.entries(VOWEL_TABLE).forEach(([base, arr]) => {
        arr.forEach((ch, toneIdx) => {
          CHAR_TO_BASE[ch] = { base, tone: toneIdx, upper: false };
          CHAR_TO_BASE[ch.toUpperCase()] = { base, tone: toneIdx, upper: true };
        });
      });

      function transformChar(ch, newBase, newTone) {
        const info = CHAR_TO_BASE[ch];
        if (!info) return ch;
        const out = VOWEL_TABLE[newBase][newTone];
        return info.upper ? out.toUpperCase() : out;
      }

      function applyTelexToWord(word, key) {
        const k = key.toLowerCase();
        const chars = Array.from(word);

        // Xử lý dd -> đ
        if (k === "d" && chars.length >= 1) {
          const last = chars[chars.length - 1];
          if (last === "d") { chars[chars.length - 1] = "đ"; return chars.join(""); }
          if (last === "D") { chars[chars.length - 1] = "Đ"; return chars.join(""); }
        }

        // Xử lý mũ/móc: aa->â, aw->ă, ee->ê, oo->ô, ow->ơ, uw->ư
        if (["a", "e", "o", "w"].includes(k)) {
          for (let i = chars.length - 1; i >= 0; i--) {
            const info = CHAR_TO_BASE[chars[i]];
            if (!info) continue;
            if (k === "a" && info.base === "a") {
              chars[i] = transformChar(chars[i], "â", info.tone);
              return chars.join("");
            }
            if (k === "e" && info.base === "e") {
              chars[i] = transformChar(chars[i], "ê", info.tone);
              return chars.join("");
            }
            if (k === "o" && info.base === "o") {
              chars[i] = transformChar(chars[i], "ô", info.tone);
              return chars.join("");
            }
            if (k === "w") {
              if (info.base === "a") { chars[i] = transformChar(chars[i], "ă", info.tone); return chars.join(""); }
              if (info.base === "o") { chars[i] = transformChar(chars[i], "ơ", info.tone); return chars.join(""); }
              if (info.base === "u") { chars[i] = transformChar(chars[i], "ư", info.tone); return chars.join(""); }
            }
          }
        }

        // Xử lý dấu thanh: s, f, r, x, j, z
        if (Object.prototype.hasOwnProperty.call(TONE_MAP, k)) {
          const targetTone = TONE_MAP[k];
          let vowelIndices = [];
          for (let i = 0; i < chars.length; i++) {
            if (CHAR_TO_BASE[chars[i]]) {
              // Bỏ qua 'u' trong 'qu' hoặc 'i' trong 'gi' nếu sau đó còn nguyên âm
              const prev = i > 0 ? chars[i - 1].toLowerCase() : "";
              if ((prev === "q" && chars[i].toLowerCase() === "u") ||
                  (prev === "g" && chars[i].toLowerCase() === "i" && i + 1 < chars.length && CHAR_TO_BASE[chars[i + 1]])) {
                continue;
              }
              vowelIndices.push(i);
            }
          }
          if (vowelIndices.length > 0) {
            // Ưu tiên nguyên âm có mũ/móc (ă, â, ê, ô, ơ, ư)
            let chosenIdx = vowelIndices[0];
            const priorityVowel = vowelIndices.find((idx) =>
              ["ă", "â", "ê", "ô", "ơ", "ư"].includes(CHAR_TO_BASE[chars[idx]].base)
            );
            if (priorityVowel !== undefined) {
              chosenIdx = priorityVowel;
            } else if (vowelIndices.length === 2) {
              // Nếu có phụ âm cuối thì đánh vào nguyên âm thứ 2
              const hasConsonantEnd = vowelIndices[1] < chars.length - 1;
              chosenIdx = hasConsonantEnd ? vowelIndices[1] : vowelIndices[0];
            } else if (vowelIndices.length >= 3) {
              chosenIdx = vowelIndices[1];
            }

            const currentInfo = CHAR_TO_BASE[chars[chosenIdx]];
            if (currentInfo.tone === targetTone && k !== "z") {
              // Bấm lặp lần 2 thì trả về chữ gốc + phím vừa bấm
              chars[chosenIdx] = transformChar(chars[chosenIdx], currentInfo.base, 0);
              return chars.join("") + key;
            }
            chars[chosenIdx] = transformChar(chars[chosenIdx], currentInfo.base, targetTone);
            return chars.join("");
          }
        }

        return word + key;
      }

      function processKeyInput(currentText, key, useTelex) {
        if (!useTelex || key === " " || key.length > 1) {
          return currentText + key;
        }
        const lastSpace = currentText.lastIndexOf(" ");
        const prefix = lastSpace >= 0 ? currentText.slice(0, lastSpace + 1) : "";
        const lastWord = lastSpace >= 0 ? currentText.slice(lastSpace + 1) : currentText;
        // Nếu đang gõ URL có '://' hoặc 'www.' thì tự bỏ qua Telex cho từ đó
        if (lastWord.includes("://") || lastWord.includes("www.") || lastWord.includes(".com")) {
          return currentText + key;
        }
        return prefix + applyTelexToWord(lastWord, key);
      }

      // =========================================================================
      // 3. QUẢN LÝ TRẠNG THÁI TRÌNH DUYỆT & CẦU NỐI BÀN PHÍM TRÊN MỌI WEBSITE
      // =========================================================================
      const state = {
        currentUrl: "",
        history: [],
        historyIndex: -1,
        proxyEnabled: true,
        telexEnabled: true,
        shiftEnabled: false,
        kbTarget: "omnibox", // 'omnibox' hoặc 'webpage-input'
        kbBuffer: ""
      };

      const els = {
        omnibox: document.getElementById("omnibox"),
        homeView: document.getElementById("home-view"),
        webView: document.getElementById("web-view"),
        iframe: document.getElementById("browser-frame"),
        loadingBar: document.getElementById("loading-bar"),
        keyboard: document.getElementById("virtual-keyboard"),
        kbTargetLabel: document.getElementById("kb-target-label"),
        kbBufferText: document.getElementById("kb-buffer-text"),
        btnProxy: document.getElementById("btn-proxy-mode"),
        keyTelex: document.getElementById("key-telex"),
        keyShift: document.getElementById("key-shift")
      };

      function openKeyboard(target, initialValue, labelText) {
        state.kbTarget = target;
        state.kbBuffer = initialValue || "";
        els.kbTargetLabel.textContent = labelText || (target === "omnibox" ? "Thanh địa chỉ / Tìm kiếm" : "Ô nhập trên trang web");
        els.keyboard.classList.add("visible");
        els.omnibox.classList.toggle("focused", target === "omnibox");
        renderKeyboardBuffer();
      }

      function closeKeyboard() {
        els.keyboard.classList.remove("visible");
        els.omnibox.classList.remove("focused");
      }

      function renderKeyboardBuffer() {
        els.kbBufferText.textContent = state.kbBuffer;
        if (state.kbTarget === "omnibox") {
          els.omnibox.textContent = state.kbBuffer || "Chạm để nhập từ khóa hoặc địa chỉ web...";
        } else if (state.kbTarget === "webpage-input" && els.iframe.contentWindow) {
          // Truyền trực tiếp chữ đang gõ vào ô <input> bên trong website
          els.iframe.contentWindow.postMessage({
            type: "TYWS_UPDATE_INPUT",
            value: state.kbBuffer
          }, "*");
        }
      }

      // =========================================================================
      // 4. SMART PROXY & SCRIPT TIÊM VÀO WEBSITE (BẮT SỰ KIỆN CHẠM Ô TÌM KIẾM)
      // =========================================================================
      function buildInjectedBridgeScript(baseUrl) {
        return `
          <base href="${baseUrl}">
          <style>
            .tyws-active-input {
              outline: 3px solid #38bdf8 !important;
              box-shadow: 0 0 12px rgba(56, 189, 248, 0.7) !important;
            }
            body { padding-bottom: 260px !important; }
          </style>
          <script>
            (function() {
              let activeEl = null;

              function isEditableInput(el) {
                if (!el) return false;
                const tag = (el.tagName || '').toUpperCase();
                if (tag === 'TEXTAREA') return true;
                if (el.isContentEditable) return true;
                if (tag === 'INPUT') {
                  const type = (el.getAttribute('type') || 'text').toLowerCase();
                  return !['button', 'submit', 'reset', 'checkbox', 'radio', 'file', 'hidden', 'image', 'range', 'color'].includes(type);
                }
                return false;
              }

              // Bắt mọi thao tác chạm vào ô tìm kiếm/nhập liệu trên website
              document.addEventListener('pointerdown', function(e) {
                const target = e.target.closest('input, textarea, [contenteditable="true"], [role="searchbox"], [role="combobox"]');
                if (target && isEditableInput(target)) {
                  if (activeEl) activeEl.classList.remove('tyws-active-input');
                  activeEl = target;
                  activeEl.classList.add('tyws-active-input');
                  setTimeout(() => {
                    try { activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' }); } catch(err){}
                  }, 100);
                  const currentVal = activeEl.value !== undefined ? activeEl.value : (activeEl.innerText || '');
                  const hint = activeEl.getAttribute('placeholder') || activeEl.getAttribute('name') || 'Ô tìm kiếm trên web';
                  window.parent.postMessage({
                    type: 'TYWS_OPEN_KB_FROM_WEB',
                    value: currentVal,
                    label: '✏️ ' + hint.slice(0, 22)
                  }, '*');
                }
              }, true);

              // Bắt thao tác bấm vào link <a> để duyệt tiếp trong trình duyệt
              document.addEventListener('click', function(e) {
                const link = e.target.closest('a[href]');
                if (!link) return;
                const rawHref = link.getAttribute('href');
                if (!rawHref || rawHref.startsWith('#') || rawHref.startsWith('javascript:')) return;
                e.preventDefault();
                e.stopPropagation();
                try {
                  const resolved = new URL(rawHref, document.baseURI).href;
                  window.parent.postMessage({ type: 'TYWS_NAVIGATE', url: resolved }, '*');
                } catch (err) {}
              }, true);

              // Bắt sự kiện submit form tìm kiếm trên trang web
              document.addEventListener('submit', function(e) {
                const form = e.target;
                if (!form) return;
                e.preventDefault();
                try {
                  const actionUrl = new URL(form.getAttribute('action') || document.baseURI, document.baseURI);
                  const formData = new FormData(form);
                  const params = new URLSearchParams(actionUrl.search);
                  for (const [k, v] of formData.entries()) {
                    params.set(k, v);
                  }
                  actionUrl.search = params.toString();
                  window.parent.postMessage({ type: 'TYWS_NAVIGATE', url: actionUrl.href }, '*');
                } catch (err) {}
              }, true);

              // Nhận chữ từ bàn phím ảo của TYWS Hub Browser
              window.addEventListener('message', function(e) {
                const data = e.data || {};
                if (data.type === 'TYWS_UPDATE_INPUT' && activeEl) {
                  if (activeEl.value !== undefined) {
                    activeEl.value = data.value;
                  } else {
                    activeEl.innerText = data.value;
                  }
                  activeEl.dispatchEvent(new Event('input', { bubbles: true }));
                  activeEl.dispatchEvent(new Event('change', { bubbles: true }));
                } else if (data.type === 'TYWS_SUBMIT_ACTIVE_INPUT' && activeEl) {
                  const form = activeEl.closest('form');
                  if (form) {
                    form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
                  } else {
                    const enterEvt = new KeyboardEvent('keydown', { key: 'Enter', code: 'Enter', keyCode: 13, which: 13, bubbles: true });
                    activeEl.dispatchEvent(enterEvt);
                  }
                }
              });
            })();
          <\/script>
        `;
      }

      async function fetchHtmlWithFallback(targetUrl) {
        const proxies = [
          (u) => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
          (u) => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
          (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`
        ];
        for (const makeProxyUrl of proxies) {
          try {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 8000);
            const res = await fetch(makeProxyUrl(targetUrl), { signal: controller.signal });
            clearTimeout(timer);
            if (res.ok) {
              const text = await res.text();
              if (text && text.length > 50) return text;
            }
          } catch (e) {}
        }
        throw new Error("Proxy fetch failed");
      }

      function normalizeInputToUrl(input) {
        const trimmed = (input || "").trim();
        if (!trimmed) return "";
        if (/^https?:\/\//i.test(trimmed)) return trimmed;
        // Nếu có dạng tên miền (vd: vnexpress.net, tinhte.vn) và không có khoảng trắng
        if (!trimmed.includes(" ") && /^[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+/.test(trimmed)) {
          return "https://" + trimmed;
        }
        // Ngược lại: Tìm kiếm qua DuckDuckGo HTML (tương thích 100% với Proxy & Bàn phím)
        return "https://html.duckduckgo.com/html/?q=" + encodeURIComponent(trimmed);
      }

      async function navigateTo(rawInput, pushHistory = true) {
        const targetUrl = normalizeInputToUrl(rawInput);
        if (!targetUrl) return;

        closeKeyboard();
        state.currentUrl = targetUrl;
        els.omnibox.textContent = targetUrl;
        els.homeView.style.display = "none";
        els.webView.style.display = "flex";
        els.loadingBar.style.display = "block";

        if (pushHistory) {
          state.history = state.history.slice(0, state.historyIndex + 1);
          state.history.push(targetUrl);
          state.historyIndex = state.history.length - 1;
        }

        // Chuyển link YouTube watch sang dạng Embed để xem mượt trên Nest Hub 2
        const ytMatch = targetUrl.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
        if (ytMatch) {
          els.iframe.removeAttribute("srcdoc");
          els.iframe.src = `https://www.youtube-nocookie.com/embed/${ytMatch[1]}?autoplay=1`;
          els.loadingBar.style.display = "none";
          return;
        }

        // Nếu tắt Proxy hoặc đang dùng Google ?igu=1 trực tiếp
        if (!state.proxyEnabled || targetUrl.includes("google.com/search?igu=1")) {
          els.iframe.removeAttribute("srcdoc");
          els.iframe.src = targetUrl;
          els.loadingBar.style.display = "none";
          return;
        }

        try {
          let html = await fetchHtmlWithFallback(targetUrl);
          // Loại bỏ CSP chặn script cầu nối
          html = html.replace(/<meta[^>]*http-equiv=["']?Content-Security-Policy["']?[^>]*>/gi, "");
          const bridgeCode = buildInjectedBridgeScript(targetUrl);
          if (/<head[^>]*>/i.test(html)) {
            html = html.replace(/<head[^>]*>/i, (match) => match + bridgeCode);
          } else {
            html = bridgeCode + html;
          }
          els.iframe.removeAttribute("src");
          els.iframe.srcdoc = html;
        } catch (err) {
          // Tự động chuyển sang mở Iframe trực tiếp nếu Proxy bị chặn
          els.iframe.removeAttribute("srcdoc");
          els.iframe.src = targetUrl;
        } finally {
          els.loadingBar.style.display = "none";
        }
      }

      function goHome() {
        closeKeyboard();
        els.loadingBar.style.display = "none";
        els.webView.style.display = "none";
        els.homeView.style.display = "flex";
        els.omnibox.textContent = "Chạm để nhập từ khóa hoặc địa chỉ web...";
      }

      // Lắng nghe tín hiệu từ các trang web bên trong Iframe gửi ra
      window.addEventListener("message", (e) => {
        const data = e.data || {};
        if (data.type === "TYWS_OPEN_KB_FROM_WEB") {
          openKeyboard("webpage-input", data.value, data.label);
        } else if (data.type === "TYWS_NAVIGATE" && data.url) {
          navigateTo(data.url, true);
        }
      });

      // =========================================================================
      // 5. GẮN SỰ KIỆN CẢM ỨNG (POINTERDOWN) CHO TOÀN BỘ GIAO DIỆN
      // =========================================================================
      function bindTouch(el, handler) {
        if (!el) return;
        el.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          e.stopPropagation();
          startAudioKeepAlive();
          handler(e);
        });
      }

      bindTouch(document.getElementById("btn-home"), () => goHome());
      bindTouch(document.getElementById("btn-back"), () => {
        if (state.historyIndex > 0) {
          state.historyIndex--;
          navigateTo(state.history[state.historyIndex], false);
        } else {
          goHome();
        }
      });
      bindTouch(document.getElementById("btn-forward"), () => {
        if (state.historyIndex < state.history.length - 1) {
          state.historyIndex++;
          navigateTo(state.history[state.historyIndex], false);
        }
      });
      bindTouch(document.getElementById("btn-reload"), () => {
        if (state.currentUrl) navigateTo(state.currentUrl, false);
      });

      bindTouch(els.omnibox, () => {
        const initVal = state.currentUrl || "";
        openKeyboard("omnibox", initVal, "🌐 Nhập URL hoặc từ khóa");
      });

      bindTouch(document.getElementById("home-search-trigger"), () => {
        openKeyboard("omnibox", "", "🔍 Tìm kiếm hoặc nhập địa chỉ web");
      });

      bindTouch(els.btnProxy, () => {
        state.proxyEnabled = !state.proxyEnabled;
        els.btnProxy.textContent = state.proxyEnabled ? "🛡️ Proxy: BẬT" : "⚡ Trực tiếp";
        els.btnProxy.classList.toggle("active-mode", state.proxyEnabled);
        if (state.currentUrl && els.webView.style.display === "flex") {
          navigateTo(state.currentUrl, false);
        }
      });

      bindTouch(document.getElementById("btn-toggle-kb"), () => {
        if (els.keyboard.classList.contains("visible")) {
          closeKeyboard();
        } else {
          openKeyboard("omnibox", "", "🌐 Nhập URL hoặc từ khóa");
        }
      });

      bindTouch(document.getElementById("kb-btn-close"), () => closeKeyboard());

      bindTouch(document.getElementById("kb-btn-search-google"), () => {
        const q = state.kbBuffer.trim();
        if (q) {
          navigateTo("https://www.google.com/search?igu=1&q=" + encodeURIComponent(q), true);
        }
      });

      // Các nút Bookmark trên Trang chủ
      document.querySelectorAll(".bm-card").forEach((btn) => {
        bindTouch(btn, () => {
          const url = btn.getAttribute("data-url");
          if (url) navigateTo(url, true);
        });
      });

      // Sự kiện cho tất cả các phím trên Bàn phím ảo
      document.querySelectorAll(".kb-key").forEach((keyBtn) => {
        bindTouch(keyBtn, () => {
          const char = keyBtn.getAttribute("data-char");
          const action = keyBtn.getAttribute("data-action");

          if (char !== null) {
            const outChar = state.shiftEnabled && char.length === 1 ? char.toUpperCase() : char;
            state.kbBuffer = processKeyInput(state.kbBuffer, outChar, state.telexEnabled);
            if (state.shiftEnabled) {
              state.shiftEnabled = false;
              els.keyShift.classList.remove("action-toggle-on");
            }
            renderKeyboardBuffer();
            return;
          }

          if (action === "backspace") {
            const chars = Array.from(state.kbBuffer);
            chars.pop();
            state.kbBuffer = chars.join("");
            renderKeyboardBuffer();
          } else if (action === "clear") {
            state.kbBuffer = "";
            renderKeyboardBuffer();
          } else if (action === "toggle-telex") {
            state.telexEnabled = !state.telexEnabled;
            els.keyTelex.textContent = state.telexEnabled ? "VN Telex: BẬT" : "VN Telex: TẮT";
            els.keyTelex.classList.toggle("action-toggle-on", state.telexEnabled);
          } else if (action === "toggle-shift") {
            state.shiftEnabled = !state.shiftEnabled;
            els.keyShift.classList.toggle("action-toggle-on", state.shiftEnabled);
          } else if (action === "submit") {
            if (state.kbTarget === "omnibox") {
              navigateTo(state
